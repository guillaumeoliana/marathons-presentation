name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Test production build in Chromium and WebKit
        run: |
          python3 -m http.server 4180 --bind 127.0.0.1 --directory dist &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          result=0
          npm run test:browser || result=1
          WEBKIT=1 npm run test:browser || result=1
          exit "$result"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
